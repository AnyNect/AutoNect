<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNect Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <style>
        /* xterm overrides */
        .xterm-viewport { background: var(--bg-card) !important; }
        .xterm-screen { padding: 8px; }
        .xterm .xterm-rows { font-family: var(--font-mono) !important; font-size: 13px !important; }
        .xterm-cursor-layer { display: none; }
        .terminal-container:focus-within .xterm-cursor-layer { display: block; }
        .terminal-container.active { height: 100%; min-height: 150px; }
        .terminal-container.readonly { height: auto; max-height: 400px; overflow: hidden; min-height: 0; }
        /* Scrollbar styling */
        .input-textarea-wrap textarea { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent; }
        .input-textarea-wrap textarea::-webkit-scrollbar { width: 18px; background: transparent; }
        .input-textarea-wrap textarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        .input-textarea-wrap textarea::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
        .input-textarea-wrap textarea::-webkit-scrollbar-button { display: none !important; height: 0 !important; width: 0 !important; background: transparent !important; }
        .input-textarea-wrap textarea::-webkit-scrollbar-track { background: transparent !important; }
        .input-textarea-wrap textarea::-webkit-scrollbar-corner { background: transparent !important; }
        .input-textarea-wrap textarea::-webkit-scrollbar { width: 18px !important; background: transparent !important; }
        .input-textarea-wrap { position: relative; }
        .custom-scrollbar { position: absolute; top: 2px; right: 2px; bottom: 2px; width: 12px; background: transparent; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .input-textarea-wrap textarea:focus + .custom-scrollbar { opacity: 1; }
        .custom-scrollbar-thumb { position: absolute; width: 100%; background: rgba(255,255,255,0.3); border-radius: 6px; min-height: 30px; pointer-events: auto; cursor: pointer; }
        .custom-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
        /* Sidebar - ensure it doesn't affect layout */
        #main-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 56px); }
        #sidebar { width: 260px; min-width: 260px; background: var(--bg-sidebar); border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.25,1,0.5,1), width 0.3s ease; overflow: hidden; z-index: 5; flex-shrink: 0; }
        #sidebar.sidebar-closed { transform: translateX(-260px); width: 0; min-width: 0; border-right: none; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .sidebar-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
        .new-chat-btn { width: 28px; height: 28px; border-radius: 6px; border: none; background: rgba(255,255,255,0.06); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
        .new-chat-btn-header { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
        .new-chat-btn-header:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .chat-list { flex: 1; overflow-y: auto; padding: 8px 8px 0 8px; }
        .chat-list .empty-message { color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 40px 12px; line-height: 1.6; }
        .sidebar-footer { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; }
        .sidebar-version { font-size: 0.7rem; color: var(--text-muted); }
        .chat-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s, opacity 0.15s; margin-bottom: 2px; position: relative; min-height: 36px; }
        .chat-item:hover { background: rgba(255,255,255,0.06); }
        .chat-item.active { background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
        .chat-item .chat-info { flex: 1; min-width: 0; }
        .chat-item .chat-name { font-size: 0.85rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
        .chat-item .chat-preview { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; margin-top: 1px; }
        .chat-item .chat-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; opacity: 0; transition: opacity 0.2s; }
        .chat-item:hover .chat-actions { opacity: 1; }
        .chat-item .chat-actions button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.15s, background 0.15s; }
        .chat-item .chat-actions button:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .chat-item .chat-actions .pin-btn.pinned { color: #fbbf24; }
        .chat-item .chat-actions .pin-btn.pinned:hover { color: #f59e0b; }
        .chat-item .chat-actions .delete-btn:hover { color: #f87171; }
        .chat-item .chat-actions svg { width: 18px; height: 18px; }
        .chat-item .chat-name-input { background: var(--bg-input); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: var(--text-primary); font-size: 0.85rem; font-weight: 500; padding: 2px 6px; outline: none; width: 100%; font-family: inherit; }
        .chat-item .chat-name-input:focus { border-color: rgba(255,255,255,0.4); }
        .chat-item .pin-icon { font-size: 0.85rem; color: var(--text-muted); flex-shrink: 0; }
        .chat-item .pin-icon.pinned { color: #fbbf24; }
        .hamburger { font-size: 1.2rem; color: var(--text-secondary); display: inline-block; line-height: 1; user-select: none; }
        .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: background 0.2s; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        /* ── Chat container & input ── */
        #chat-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
        #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; scroll-behavior: smooth; }
        #chat-area { width: 100%; max-width: 768px; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px; flex: 1; }
        #input-container { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 16px 24px 16px; background: linear-gradient(180deg, rgba(33,33,33,0) 0%, var(--bg-main) 30%); flex-shrink: 0; }
        .input-wrapper { width: 100%; max-width: 768px; display: flex; flex-direction: column; align-items: center; }
        /* ── Responsive ── */
        @media (max-width: 768px) {
            #sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: 280px; min-width: 280px; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.25,1,0.5,1); border-right: 1px solid rgba(255,255,255,0.08); box-shadow: 4px 0 24px rgba(0,0,0,0.3); z-index: 100; }
            #sidebar.sidebar-open { transform: translateX(0); }
            #sidebar.sidebar-closed { transform: translateX(-100%); width: 280px; min-width: 280px; border-right: 1px solid rgba(255,255,255,0.08); }
            .hamburger { display: inline-block; }
            .sidebar-overlay { display: none; position: fixed; top: 56px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 99; backdrop-filter: blur(2px); }
            .sidebar-overlay.active { display: block; }
        }
        @media (min-width: 769px) {
            .hamburger { display: none; }
            #sidebar.sidebar-closed { transform: translateX(0); width: 0; min-width: 0; border-right: none; }
            #sidebar.sidebar-closed .sidebar-header,
            #sidebar.sidebar-closed .chat-list,
            #sidebar.sidebar-closed .sidebar-footer { display: none; }
        }
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="brand" onclick="toggleSidebar()">
            <span class="hamburger" id="hamburger-btn">☰</span>
            <span class="brand-title">AutoNect</span>
            <span class="brand-version">DeepSeek</span>
        </div>
        <div class="header-actions">
            <button class="new-chat-btn-header" onclick="newChat()" title="New Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
        </div>
    </header>

    <div id="main-layout">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar-closed">
            <div class="sidebar-header">
                <span class="sidebar-title">Chats</span>
                <button class="new-chat-btn" onclick="newChat()" title="New Chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>
            <div id="chat-list" class="chat-list"></div>
            <div class="sidebar-footer">
                <span class="sidebar-version">v1.0.0</span>
            </div>
        </div>

        <!-- Chat area + input -->
        <div id="chat-wrapper">
            <div id="chat-container">
                <div id="chat-area"></div>
            </div>

            <div id="input-container">
                <div class="input-wrapper">
                    <!-- Queue Bubble -->
                    <div id="queue-bubble" class="queue-bubble expanded">
                        <div class="queue-bubble-header" onclick="toggleQueueBubble()">
                            <div class="queue-bubble-title">
                                <span>Upcoming Tasks</span>
                                <span class="queue-badge" id="queueBadge">0 QUEUED</span>
                            </div>
                            <div class="queue-header-actions">
                                <button class="pause-queue-btn" id="pauseBtn" onclick="togglePauseQueue(event)">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                        <rect x="6" y="4" width="4" height="16"></rect>
                                        <rect x="14" y="4" width="4" height="16"></rect>
                                    </svg>
                                    <span>Pause</span>
                                </button>
                                <svg class="queue-bubble-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="queue-bubble-body">
                            <div class="queue-bubble-body-inner" id="queueList"></div>
                        </div>
                    </div>

                    <div class="input-box">
                        <div class="input-textarea-wrap">
                            <textarea id="prompt" rows="1" placeholder="Message AutoNect..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                            <div class="custom-scrollbar"></div>
                        </div>
                        <div class="input-controls-row">
                            <div class="controls-left"></div>
                            <div class="controls-right">
                                <button id="autoAllowBtn" title="Toggle Auto-Allow for safe commands">
                                    <svg id="auto-allow-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
                                        <defs><linearGradient id="disabled-bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#2A2A2A"/><stop offset="100%" stop-color="#222222"/></linearGradient></defs>
                                        <style>@keyframes seamless-flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-25}}.radar-stroke-seamless{stroke-dasharray:10 15;animation:seamless-flow 2s linear infinite}</style>
                                        <g transform="translate(4,4)">
                                            <rect x="0" y="0" width="40" height="40" rx="20" fill="url(#disabled-bg)" stroke="#333333" stroke-width="1.2"/>
                                            <path class="radar-stroke-seamless" d="M 20 8 L 30 12 V 21 C 30 27.5 20 32.5 20 32.5 C 20 32.5 10 27.5 10 21 V 12 L 20 8 Z" fill="none" stroke="#666666" stroke-width="1.5" stroke-linejoin="round" opacity="0.45"/>
                                            <g transform="translate(0,0.5)"><path d="M 17 18 V 15.5 A 3 3 0 0 1 23 15.5 V 18" fill="none" stroke="#555555" stroke-width="1.6" stroke-linecap="round"/><rect x="15.5" y="18" width="9" height="7.5" rx="1.2" fill="#1A1A1A" stroke="#444444" stroke-width="1.2"/><circle cx="20" cy="21.5" r="0.7" fill="#666666"/></g>
                                            <circle cx="31" cy="9" r="2" fill="#444444"/>
                                        </g>
                                    </svg>
                                    <svg id="auto-allow-on" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
                                        <defs><filter id="autonect-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="active-bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#383838"/><stop offset="100%" stop-color="#282828"/></linearGradient><linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#10B981" stop-opacity="0"/><stop offset="50%" stop-color="#34D399" stop-opacity="0.6"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></linearGradient><clipPath id="shield-clip"><path d="M 20 8 L 30 12 V 21 C 30 27.5 20 32.5 20 32.5 C 20 32.5 10 27.5 10 21 V 12 L 20 8 Z"/></clipPath></defs>
                                        <style>@keyframes autonect-pulse{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:0.45;transform:scale(1.03)}}@keyframes autonect-scan{0%{transform:translateY(-18px)}100%{transform:translateY(22px)}}@keyframes autonect-float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-1px)}}.glow-layer{transform-origin:center;animation:autonect-pulse 3s ease-in-out infinite}.scan-beam{animation:autonect-scan 2.2s linear infinite}.floating-shield{animation:autonect-float 3s ease-in-out infinite}</style>
                                        <g transform="translate(4,4)">
                                            <rect class="glow-layer" x="0" y="0" width="40" height="40" rx="20" fill="#10B981" filter="url(#autonect-glow)"/>
                                            <rect x="0" y="0" width="40" height="40" rx="20" fill="url(#active-bg)" stroke="#424242" stroke-width="1.2"/>
                                            <g class="floating-shield"><path d="M 20 8 L 30 12 V 21 C 30 27.5 20 32.5 20 32.5 C 20 32.5 10 27.5 10 21 V 12 L 20 8 Z" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-width="1.5" stroke-linejoin="round"/><g clip-path="url(#shield-clip)"><rect class="scan-beam" x="8" y="0" width="24" height="10" fill="url(#scan-grad)"/></g><path d="M 15.5 19 L 18.5 22 L 24.5 15.5" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
                                            <circle cx="31" cy="9" r="2" fill="#34D399"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
                                        </g>
                                    </svg>
                                </button>
                                <button id="send-btn" onclick="handleSend()" disabled>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="19" x2="12" y2="5"></line>
                                        <polyline points="5 12 12 5 19 12"></polyline>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="footer-note">AutoNect can make mistakes. Verify important info.</div>
            </div>
        </div>
    </div>
</div>

<script src="/static/script.js?v=5"></script>

<!-- Terminal Modal -->
<div class="terminal-modal-overlay" id="terminal-modal">
    <div class="terminal-modal">
        <div class="modal-header">
            <div class="modal-dots">
                <div class="modal-dot close" onclick="closeTerminalModal()"></div>
                <div class="modal-dot minimize"></div>
                <div class="modal-dot maximize"></div>
            </div>
            <div class="modal-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                Interactive Terminal Session
            </div>
            <div style="width:52px;"></div>
        </div>
        <div class="modal-body">
            <div id="modal-terminal-container" class="terminal-container"></div>
        </div>
    </div>
</div>

</body>
</html>

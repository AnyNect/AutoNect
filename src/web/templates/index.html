<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNect Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js – VS Code–style syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- xterm.js – interactive terminal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=2">
    <style>
        /* Make xterm blend into command card */
        .xterm-viewport {
            background: var(--bg-card) !important;
        }
        .xterm-screen {
            padding: 8px;
        }
        .xterm .xterm-rows {
            font-family: var(--font-mono) !important;
            font-size: 13px !important;
        }
        /* Hide xterm cursor when not focused */
        .xterm-cursor-layer {
            display: none;
        }
        .terminal-container:focus-within .xterm-cursor-layer {
            display: block;
        }
        /* Terminal container fills space while running */
        .terminal-container.active {
            height: 100%;
            min-height: 150px;
        }
        /* After command exits, show full output */
        .terminal-container.readonly {
            height: auto;
            max-height: 400px;
            overflow: hidden;
            min-height: 0;
        }
    /* Sleek transparent scrollbar */
    .input-textarea-wrap textarea {
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.3) transparent;
    }
    .input-textarea-wrap textarea::-webkit-scrollbar {
        width: 18px;
        background: transparent;
    }
    .input-textarea-wrap textarea::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.3);
        border-radius: 10px;
    }
    .input-textarea-wrap textarea::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.5);
    }
    .input-textarea-wrap textarea::-webkit-scrollbar-button:vertical:decrement,
    .input-textarea-wrap textarea::-webkit-scrollbar-button:vertical:increment,
    .input-textarea-wrap textarea::-webkit-scrollbar-button:horizontal:decrement,
    .input-textarea-wrap textarea::-webkit-scrollbar-button:horizontal:increment {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
    }
    
    /* Force hide arrows on WebKit/Blink */
    .input-textarea-wrap textarea::-webkit-scrollbar-button {
        display: none !important;
        height: 0 !important;
        width: 0 !important;
        background: transparent !important;
    }
    .input-textarea-wrap textarea::-webkit-scrollbar-track {
        background: transparent !important;
    }
    .input-textarea-wrap textarea::-webkit-scrollbar-corner {
        background: transparent !important;
    }
    .input-textarea-wrap textarea::-webkit-scrollbar {
        width: 18px !important;
        background: transparent !important;
    }

    
    /* Hide native scrollbar entirely */
    .input-textarea-wrap textarea {
        scrollbar-width: none;  /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
    }
    .input-textarea-wrap textarea::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
    }
    /* Custom scrollbar container */
    .input-textarea-wrap {
        position: relative;
    }
    .custom-scrollbar {
        position: absolute;
        top: 2px;
        right: 2px;
        bottom: 2px;
        width: 12px;
        background: transparent;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
    }
    .input-textarea-wrap textarea:focus + .custom-scrollbar {
        opacity: 1;
    }
    .custom-scrollbar-thumb {
        position: absolute;
        width: 100%;
        background: rgba(255,255,255,0.3);
        border-radius: 6px;
        min-height: 30px;
        pointer-events: auto;
        cursor: pointer;
    }
    .custom-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.5);
    }


    /* Hide native scrollbar entirely */
    .input-textarea-wrap textarea {
        scrollbar-width: none;  /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
    }
    .input-textarea-wrap textarea::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
    }




        50% {
            transform: scale(2);
            opacity: 0;
        }
    }

</style>
</head>
<body>
    <div id="app">
        <header>
            <div class="brand">
                <span class="brand-title">AutoNect</span>
                <span class="brand-version">DeepSeek</span>
            </div>
        </header>

        <div id="chat-container">
            <div id="chat-area"></div>
        </div>

        <div id="input-container">
            <div class="input-wrapper">

                <!-- Queue Bubble -->
                <div id="queue-bubble" class="queue-bubble expanded">
                    <div class="queue-bubble-header" onclick="toggleQueueBubble()">
                        <div class="queue-bubble-title">
                            <span>Upcoming Tasks</span>
                            <span class="queue-badge" id="queueBadge">0 QUEUED</span>
                        </div>
<div class="queue-header-actions">
    <button class="pause-queue-btn" id="pauseBtn" onclick="togglePauseQueue(event)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
        <span>Pause</span>
    </button>
    <svg class="queue-bubble-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
</div>
                    </div>
                    <div class="queue-bubble-body">
                        <div class="queue-bubble-body-inner" id="queueList"></div>
                    </div>
                </div>

                <!-- ── MAIN INPUT BOX – two‑row layout ── -->
                <div class="input-box">
                    <div class="input-textarea-wrap">
                        <textarea 
                            id="prompt" 
                            rows="1" 
                            placeholder="Message AutoNect..." 
                            oninput="autoResize(this)"
                            onkeydown="handleKeyDown(event)"
                        ></textarea><div class="custom-scrollbar"></div>
                    </div>

                    <div class="input-controls-row">
                        <div class="controls-left">
                            <!-- Placeholder for future controls (e.g., model selector) -->
                        </div>
                        <div class="controls-right">
                            <button id="autoAllowBtn" title="Toggle Auto-Allow for safe commands">
                                <svg id="auto-allow-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
                                    <defs>
                                        <linearGradient id="disabled-bg" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stop-color="#2A2A2A" />
                                            <stop offset="100%" stop-color="#222222" />
                                        </linearGradient>
                                    </defs>
                                    <style>
                                        @keyframes seamless-flow {
                                            0% { stroke-dashoffset: 0; }
                                            100% { stroke-dashoffset: -25; }
                                        }
                                        .radar-stroke-seamless { 
                                            stroke-dasharray: 10 15; 
                                            animation: seamless-flow 2s linear infinite; 
                                        }
                                    </style>
                                    <g transform="translate(4, 4)">
                                        <rect x="0" y="0" width="40" height="40" rx="20" fill="url(#disabled-bg)" stroke="#333333" stroke-width="1.2" />
                                        <path class="radar-stroke-seamless" d="M 20 8 L 30 12 V 21 C 30 27.5 20 32.5 20 32.5 C 20 32.5 10 27.5 10 21 V 12 L 20 8 Z" 
                                              fill="none" stroke="#666666" stroke-width="1.5" stroke-linejoin="round" opacity="0.45" />
                                        <g transform="translate(0, 0.5)">
                                            <path d="M 17 18 V 15.5 A 3 3 0 0 1 23 15.5 V 18" 
                                                  fill="none" stroke="#555555" stroke-width="1.6" stroke-linecap="round" />
                                            <rect x="15.5" y="18" width="9" height="7.5" rx="1.2" fill="#1A1A1A" stroke="#444444" stroke-width="1.2" />
                                            <circle cx="20" cy="21.5" r="0.7" fill="#666666" />
                                        </g>
                                        <circle cx="31" cy="9" r="2" fill="#444444" />
                                    </g>
                                </svg>
                                <svg id="auto-allow-on" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
                                    <defs>
                                        <filter id="autonect-glow" x="-30%" y="-30%" width="160%" height="160%">
                                            <feGaussianBlur stdDeviation="3" result="blur" />
                                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                        </filter>
                                        <linearGradient id="active-bg" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stop-color="#383838" />
                                            <stop offset="100%" stop-color="#282828" />
                                        </linearGradient>
                                        <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
                                            <stop offset="50%" stop-color="#34D399" stop-opacity="0.6" />
                                            <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
                                        </linearGradient>
                                        <clipPath id="shield-clip">
                                            <path d="M 20 8 L 30 12 V 21 C 30 27.5 20 32.5 20 32.5 C 20 32.5 10 27.5 10 21 V 12 L 20 8 Z" />
                                        </clipPath>
                                    </defs>
                                    <style>
                                        @keyframes autonect-pulse {
                                            0%, 100% { opacity: 0.2; transform: scale(1); }
                                            50% { opacity: 0.45; transform: scale(1.03); }
                                        }
                                        @keyframes autonect-scan {
                                            0% { transform: translateY(-18px); }
                                            100% { transform: translateY(22px); }
                                        }
                                        @keyframes autonect-float {
                                            0%, 100% { transform: translateY(0px); }
                                            50% { transform: translateY(-1px); }
                                        }
                                        .glow-layer { transform-origin: center; animation: autonect-pulse 3s ease-in-out infinite; }
                                        .scan-beam { animation: autonect-scan 2.2s linear infinite; }
                                        .floating-shield { animation: autonect-float 3s ease-in-out infinite; }
                                    </style>
                                    <g transform="translate(4, 4)">
                                        <rect class="glow-layer" x="0" y="0" width="40" height="40" rx="20" fill="#10B981" filter="url(#autonect-glow)" />
                                        <rect x="0" y="0" width="40" height="40" rx="20" fill="url(#active-bg)" stroke="#424242" stroke-width="1.2" />
                                        <g class="floating-shield">
                                            <path d="M 20 8 L 30 12 V 21 C 30 27.5 20 32.5 20 32.5 C 20 32.5 10 27.5 10 21 V 12 L 20 8 Z" 
                                                  fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-width="1.5" stroke-linejoin="round" />
                                            <g clip-path="url(#shield-clip)">
                                                <rect class="scan-beam" x="8" y="0" width="24" height="10" fill="url(#scan-grad)" />
                                            </g>
                                            <path d="M 15.5 19 L 18.5 22 L 24.5 15.5" 
                                                  fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                        </g>
                                        <circle cx="31" cy="9" r="2" fill="#34D399">
                                            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
                                        </circle>
                                    </g>
                                </svg>
                            </button>
                            <button id="send-btn" onclick="handleSend()" disabled>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
            <div class="footer-note">AutoNect can make mistakes. Verify important info.</div>
        </div>
    </div>

    <!-- Only one script.js include -->
    <script src="/static/script.js?v=3"></script>

    <!-- Terminal Modal -->
    <div class="terminal-modal-overlay" id="terminal-modal">
        <div class="terminal-modal">
            <div class="modal-header">
                <div class="modal-dots">
                    <div class="modal-dot close" onclick="closeTerminalModal()"></div>
                    <div class="modal-dot minimize"></div>
                    <div class="modal-dot maximize"></div>
                </div>
                <div class="modal-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    Interactive Terminal Session
                </div>
                <div style="width: 52px;"></div>
            </div>
            <div class="modal-body">
                <div id="modal-terminal-container" class="terminal-container"></div>
            </div>
        </div>
    </div>

</body>
</html>

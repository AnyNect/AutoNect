<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle background glow -->
  <circle cx="200" cy="200" r="140" fill="#00f2fe" opacity="0.04" filter="url(#glow)"/>
  <circle cx="920" cy="200" r="160" fill="#10b981" opacity="0.05" filter="url(#glow)"/>

  <!-- Left Side: Title, Description & Pills -->
  <g transform="translate(60, 0)">
    <!-- Prompt / Category -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#10b981" font-family="Courier, monospace" font-size="16" font-weight="bold">&gt;_</text>
      <text x="28" y="-1" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">AUTONOMOUS AI-SHELL BRIDGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="900" letter-spacing="-1">AutoNect</text>

    <!-- Description Text -->
    <g transform="translate(0, 185)" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      <text x="0" y="0">Controls web-based AI through your browser and</text>
      <text x="0" y="22">safely executes commands on your local machine.</text>
    </g>

    <!-- Feature Pills with Command Guard highlighted -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="105" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52.5" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DeepSeek UI</text>

      <rect x="115" y="0" width="135" height="30" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="182.5" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Command Guard</text>

      <rect x="260" y="0" width="90" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="305" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Playwright</text>
    </g>
  </g>

  <!-- Right Side: Terminal with Guard Focus -->
  <g transform="translate(660, 65)">
    <rect width="480" height="270" rx="10" fill="url(#guardGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Terminal Header -->
    <path d="M 0,0 L 480,0 L 480,38 L 0,38 Z" fill="#1e293b" rx="10"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="19" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="19" r="6" fill="#10b981" opacity="0.8"/>
    <text x="240" y="24" fill="#94a3b8" font-family="Courier, monospace" font-size="13" text-anchor="middle">autonect-security-guard</text>

    <!-- Security Shield Icon on Header Right -->
    <g transform="translate(450, 19)">
      <path d="M 0,-6 L 7,-3 L 7,3 C 7,7 3,10 0,11 C -3,10 -7,7 -7,3 L -7,-3 Z" fill="#10b981" filter="url(#shieldGlow)"/>
    </g>

    <!-- Terminal Content emphasizing Guard -->
    <g transform="translate(24, 62)" font-family="Courier, monospace" font-size="13">
      <text x="0" y="0" fill="#38bdf8">$ command: rm -rf /</text>
      <text x="0" y="25" fill="#ef4444">[GUARD] Blocked: Destructive pattern matched</text>
      <text x="0" y="52" fill="#38bdf8">$ command: git status</text>
      <text x="0" y="77" fill="#34d399">[GUARD] AST &amp; Path Protection: ALLOW</text>
      <text x="0" y="104" fill="#facc15">[EXEC] Safe execution in workspace PTY</text>
      <text x="0" y="132" fill="#00f2fe">&gt; Multi-stage security layer active...</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#textGrad)" rx="2"/>
</svg>

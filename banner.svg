<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle background glow -->
  <circle cx="250" cy="200" r="160" fill="#00f2fe" opacity="0.05" filter="url(#glow)"/>
  <circle cx="950" cy="200" r="170" fill="#10b981" opacity="0.05" filter="url(#glow)"/>

  <!-- Left Side: Title, Description & Pills (Scaled Up & Better Positioned) -->
  <g transform="translate(65, 0)">
    <!-- Prompt / Category -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" fill="#10b981" font-family="Courier, monospace" font-size="18" font-weight="bold">&gt;_</text>
      <text x="32" y="-1" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">AUTONOMOUS AI-SHELL BRIDGE</text>
    </g>

    <!-- Main Title (84px) -->
    <text x="0" y="152" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="84" font-weight="900" letter-spacing="-1.5">AutoNect</text>

    <!-- Description Text (18px) -->
    <g transform="translate(0, 200)" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">
      <text x="0" y="0">Controls web-based AI through your browser and</text>
      <text x="0" y="28">safely executes commands on your local machine.</text>
    </g>

    <!-- Feature Pills with Command Guard highlighted -->
    <g transform="translate(0, 268)">
      <rect x="0" y="0" width="120" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="60" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">DeepSeek UI</text>

      <rect x="130" y="0" width="160" height="34" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="210" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Command Guard</text>

      <rect x="300" y="0" width="105" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="352.5" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Playwright</text>
    </g>
  </g>

  <!-- Right Side: Terminal with Guard Focus -->
  <g transform="translate(670, 60)">
    <rect width="470" height="280" rx="10" fill="url(#guardGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Terminal Header -->
    <path d="M 0,0 L 470,0 L 470,38 L 0,38 Z" fill="#1e293b" rx="10"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="19" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="19" r="6" fill="#10b981" opacity="0.8"/>
    <text x="235" y="24" fill="#94a3b8" font-family="Courier, monospace" font-size="13" text-anchor="middle">autonect-security-guard</text>

    <!-- Security Shield Icon on Header Right -->
    <g transform="translate(440, 19)">
      <path d="M 0,-6 L 7,-3 L 7,3 C 7,7 3,10 0,11 C -3,10 -7,7 -7,3 L -7,-3 Z" fill="#10b981" filter="url(#shieldGlow)"/>
    </g>

    <!-- Terminal Content emphasizing Guard -->
    <g transform="translate(24, 65)" font-family="Courier, monospace" font-size="13">
      <text x="0" y="0" fill="#38bdf8">$ command: rm -rf /</text>
      <text x="0" y="26" fill="#ef4444">[GUARD] Blocked: Destructive pattern matched</text>
      <text x="0" y="54" fill="#38bdf8">$ command: git status</text>
      <text x="0" y="80" fill="#34d399">[GUARD] AST &amp; Path Protection: ALLOW</text>
      <text x="0" y="108" fill="#facc15">[EXEC] Safe execution in workspace PTY</text>
      <text x="0" y="138" fill="#00f2fe">&gt; Multi-stage security layer active...</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#textGrad)" rx="2"/>
</svg>

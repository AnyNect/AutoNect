<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <rect width="1200" height="300" fill="#0d0e11"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)" opacity="0.05"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0021ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="70" fill="none" stroke="url(#grad)" stroke-width="4"/>
  <circle cx="150" cy="150" r="60" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <circle cx="150" cy="150" r="50" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <text x="150" y="160" font-family="'JetBrains Mono', monospace" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="bold">⚡</text>
  <text x="280" y="130" font-family="'Inter', -apple-system, sans-serif" font-size="48" fill="#ffffff" font-weight="700">AutoNect</text>
  <text x="280" y="175" font-family="'Inter', -apple-system, sans-serif" font-size="20" fill="#b4b4b4">Autonomous AI–Shell Bridge</text>
  <text x="280" y="210" font-family="'JetBrains Mono', monospace" font-size="14" fill="#676767">Browser Automation · Command Execution · Security</text>
  <text x="1150" y="280" font-family="'Inter', sans-serif" font-size="12" fill="#444" text-anchor="end">AnyNect · MIT</text>
</svg>